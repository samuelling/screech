name: Screenshots

# Builds the Debug app for the simulator, launches it once per staged scene (Screech/App/Screenshots.swift)
# on a 6.9" iPhone, and commits the raw 1320×2868 screenshots to AppStore/screenshots/raw on the same branch.
# AppStore/frame.py then adds the captions.
on:
  workflow_dispatch:
  push:
    branches: ['appstore-*']
    paths: ['Screech/**', '.github/workflows/screenshots.yml']

permissions:
  contents: write

concurrency: screenshots-${{ github.ref }}

jobs:
  shoot:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Pick Xcode
        run: |
          X=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$X"
          xcodebuild -version

      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild -project Screech.xcodeproj -scheme Screech -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E "error:|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Shoot
        run: |
          set -e
          xcrun simctl list devices available | grep -E "Pro Max" || true
          DEV=$(xcrun simctl list devices available | grep -E "iPhone 1[67] Pro Max \(" | tail -1 | grep -oE "[0-9A-F]{8}-[0-9A-F-]{27}")
          echo "Simulator $DEV"
          xcrun simctl boot "$DEV"
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl ui "$DEV" appearance dark
          xcrun simctl status_bar "$DEV" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 --dataNetwork wifi
          xcrun simctl install "$DEV" "$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/Screech.app"
          mkdir -p AppStore/screenshots/raw
          n=1
          for s in send listen photo-send photo-receive locked help; do
            xcrun simctl launch "$DEV" com.samuelling.screech -screenshot "$s"
            sleep 8
            xcrun simctl io "$DEV" screenshot "AppStore/screenshots/raw/$n-$s.png"
            xcrun simctl terminate "$DEV" com.samuelling.screech || true
            n=$((n + 1))
          done
          sips -g pixelWidth -g pixelHeight AppStore/screenshots/raw/*.png | grep -E "pixel|png"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: |
            AppStore/screenshots/raw
            build.log
          if-no-files-found: ignore

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AppStore/screenshots/raw
          git diff --cached --quiet && exit 0
          git commit -m "Screenshots: raw simulator captures"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
